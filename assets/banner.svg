<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">vibecode-tells</title>
<desc id="d">Three panels. 1, default output: a landing page with a purple gradient button, a blurred orb, three feature cards and the headline "It's not a to-do list. It's a second brain." 2, scan.py flags four tells by number. 3, the same page decided on purpose: a plain headline, a text link and a real task list. A rescan finds no mechanical tells.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.pin{fill:#c8963e}
.pn{font-size:8px;font-weight:700;fill:#141618;text-anchor:middle}
.box{fill:none;stroke:#c8963e;stroke-width:1;stroke-dasharray:3 2}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.ra{animation:ra 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
.rg{animation:rg 12s infinite}
.rh{animation:rh 12s infinite}
.ri{animation:ri 12s infinite}
.rj{animation:rj 12s infinite}
.rk{animation:rk 12s infinite}
@keyframes h1{0%,44%{opacity:1}48%,96%{opacity:0}100%{opacity:1}}
@keyframes h2{0%,7%{opacity:0}10%,44%{opacity:1}48%,100%{opacity:0}}
@keyframes h3{0%,48%{opacity:0}52%,86%{opacity:1}90%,100%{opacity:0}}
@keyframes ra{0%,8%{opacity:0}10%,96%{opacity:1}100%{opacity:0}}
@keyframes rb{0%,14%{opacity:0}16%,96%{opacity:1}100%{opacity:0}}
@keyframes rc{0%,20%{opacity:0}22%,96%{opacity:1}100%{opacity:0}}
@keyframes re{0%,27%{opacity:0}29%,96%{opacity:1}100%{opacity:0}}
@keyframes rf{0%,34%{opacity:0}36%,96%{opacity:1}100%{opacity:0}}
@keyframes rg{0%,41%{opacity:0}43%,96%{opacity:1}100%{opacity:0}}
@keyframes rh{0%,51%{opacity:0}53%,96%{opacity:1}100%{opacity:0}}
@keyframes ri{0%,56%{opacity:0}58%,96%{opacity:1}100%{opacity:0}}
@keyframes rj{0%,61%{opacity:0}63%,96%{opacity:1}100%{opacity:0}}
@keyframes rk{0%,68%{opacity:0}70%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="btn"><rect x="46" y="174" width="72" height="15" rx="7.5"/></clipPath></defs>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="32" class="sans" font-size="10" letter-spacing="2.2" fill="#8b9096">AGENT SKILL + SCANNER · 30 TELLS</text>
<text x="32" y="62" class="serif" font-size="28" fill="#e4dfd4">vibecode-tells</text>
<text x="222" y="62" class="sans" font-size="13.5" fill="#a9adb2">Keeps AI-built websites from looking AI-built.</text>

<g>
<text x="32" y="94" class="sans lab" fill="#a39bbd">1 · DEFAULT OUTPUT</text>
<rect x="32" y="104" width="264" height="148" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="104" width="264" height="148" rx="3" stroke="#a39bbd"/>
<rect x="46" y="116" width="30" height="6" rx="1" fill="#3d4248"/>
<g fill="#8a7fae"><circle cx="254" cy="154" r="34" opacity=".09"/><circle cx="254" cy="154" r="23" opacity=".12"/><circle cx="254" cy="154" r="12" opacity=".18"/></g>
<text x="46" y="146" class="serif" font-size="15" fill="#b3aacb">It's not a to-do list.</text>
<text x="46" y="164" class="serif" font-size="15" fill="#c7a9c0">It's a second brain.</text>
<g clip-path="url(#btn)"><rect x="46" y="174" width="18" height="15" fill="#5c5480"/><rect x="64" y="174" width="18" height="15" fill="#62557f"/><rect x="82" y="174" width="18" height="15" fill="#68567d"/><rect x="100" y="174" width="18" height="15" fill="#6e577c"/></g>
<text x="82" y="184.5" class="sans" font-size="8.5" fill="#e4dfd4" text-anchor="middle">Get started</text>
<g fill="#22262a" stroke="#353a40"><rect x="46" y="198" width="74" height="44" rx="6"/><rect x="126" y="198" width="74" height="44" rx="6"/><rect x="206" y="198" width="74" height="44" rx="6"/></g>
<g fill="none" stroke="#7d838a"><rect x="54" y="206" width="7" height="7" rx="2"/><rect x="134" y="206" width="7" height="7" rx="2"/><rect x="214" y="206" width="7" height="7" rx="2"/></g>
<g fill="#3d4248"><rect x="54" y="221" width="50" height="3"/><rect x="54" y="229" width="36" height="3"/><rect x="134" y="221" width="50" height="3"/><rect x="134" y="229" width="36" height="3"/><rect x="214" y="221" width="50" height="3"/><rect x="214" y="229" width="36" height="3"/></g>
<g class="rc"><rect class="box" x="42" y="171" width="80" height="22"/><circle class="pin" cx="130" cy="182" r="7.5"/><text class="sans pn" x="130" y="185">1</text></g>
<g class="re"><rect class="box" x="42" y="195" width="242" height="51"/><circle class="pin" cx="163" cy="195" r="7.5"/><text class="sans pn" x="163" y="198">6</text></g>
<g class="rf"><rect class="box" x="42" y="131" width="144" height="38"/><circle class="pin" cx="194" cy="150" r="7.5"/><text class="sans pn" x="194" y="153">15</text></g>
<g class="rg"><circle class="box" cx="254" cy="154" r="38"/><circle class="pin" cx="227" cy="127" r="7.5"/><text class="sans pn" x="227" y="130">22</text></g>
<text x="32" y="274" class="sans cap">What an agent ships when nothing is decided.</text>
</g>

<g>
<text x="318" y="94" class="sans lab" fill="#c8963e">2 · SCAN.PY FLAGS EACH TELL</text>
<rect x="318" y="104" width="264" height="148" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h2" x="318" y="104" width="264" height="148" rx="3" stroke="#c8963e"/>
<g class="mono" font-size="10.5">
<text class="ra" x="332" y="126" fill="#8b9096">$ python scan.py site/</text>
<g class="rb" fill="#e4dfd4"><text x="332" y="146">Vibecode scan: site/</text><text x="332" y="162">4 of 30 tells flagged</text></g>
<g class="rc"><text x="332" y="186" fill="#c8963e">#1</text><text x="362" y="186" fill="#e4dfd4">Harsh gradients</text></g>
<g class="re"><text x="332" y="204" fill="#c8963e">#6</text><text x="362" y="204" fill="#e4dfd4">3 feature cards in a row</text></g>
<g class="rf"><text x="332" y="222" fill="#c8963e">#15</text><text x="362" y="222" fill="#e4dfd4">"It's not X, it's Y" copy</text></g>
<g class="rg"><text x="332" y="240" fill="#c8963e">#22</text><text x="362" y="240" fill="#e4dfd4">Radial orbs</text></g>
</g>
<text x="318" y="274" class="sans cap">Hits are leads to verify, not verdicts.</text>
</g>

<g>
<text x="604" y="94" class="sans lab" fill="#93ad8c">3 · DECIDED ON PURPOSE</text>
<rect x="604" y="104" width="264" height="148" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h3" x="604" y="104" width="264" height="148" rx="3" stroke="#93ad8c"/>
<rect x="618" y="116" width="30" height="6" rx="1" fill="#3d4248"/>
<g class="rh serif" font-size="15" fill="#e4dfd4"><text x="618" y="146">A to-do list sorted by</text><text x="618" y="164">what's due next.</text></g>
<g class="ri"><text x="618" y="185" class="sans" font-size="10" fill="#93ad8c">Start a list</text><line x1="618" y1="188.5" x2="673" y2="188.5" stroke="#93ad8c"/></g>
<g class="rj">
<rect x="618" y="198" width="236" height="44" rx="2" fill="#17191c" stroke="#353a40"/>
<g stroke="#2a2e33"><line x1="619" y1="212.7" x2="853" y2="212.7"/><line x1="619" y1="227.3" x2="853" y2="227.3"/></g>
<g class="mono" font-size="8.5"><text x="628" y="208.5" fill="#93ad8c">Thu</text><text x="656" y="208.5" fill="#e4dfd4">Send Q3 invoice</text><text x="628" y="223" fill="#93ad8c">Fri</text><text x="656" y="223" fill="#e4dfd4">Renew car registration</text><text x="628" y="237.5" fill="#93ad8c">Mon</text><text x="656" y="237.5" fill="#e4dfd4">Book dentist cleaning</text></g>
</g>
<text class="rk mono" x="604" y="274" font-size="11" fill="#93ad8c">Rescan: No mechanical tells found.</text>
</g>
</svg>
