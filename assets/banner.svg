<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">vibecode-tells</title>
<desc id="d">Three panels. 1, default output: the repo's test fixture vibecoded.html, a page with a gradient headline reading "It's not a to-do list. It's a second brain.", a blurred orb and three feature cards, marked with flags 1, 15, 22 and 6. 2, real scan.py output on that fixture: 29 of 30 tells flagged, with the four marked tells listed. 3, the repo's clean.html fixture, a plain serif headline with Terms of Service and Privacy Policy links; scan.py reports no mechanical tells found.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.pin{fill:#c8963e}
.pn{font-size:10px;font-weight:700;fill:#141618;text-anchor:middle}
.box{fill:none;stroke:#c8963e;stroke-width:1;stroke-dasharray:3 2}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
.rg{animation:rg 12s infinite}
.rh{animation:rh 12s infinite}
.ri{animation:ri 12s infinite}
.rk{animation:rk 12s infinite}
@keyframes h1{0%,44%{opacity:1}48%,96%{opacity:0}100%{opacity:1}}
@keyframes h2{0%,7%{opacity:0}10%,44%{opacity:1}48%,100%{opacity:0}}
@keyframes h3{0%,48%{opacity:0}52%,86%{opacity:1}90%,100%{opacity:0}}
@keyframes rb{0%,9%{opacity:0}11%,96%{opacity:1}100%{opacity:0}}
@keyframes rc{0%,18%{opacity:0}20%,96%{opacity:1}100%{opacity:0}}
@keyframes re{0%,25%{opacity:0}27%,96%{opacity:1}100%{opacity:0}}
@keyframes rf{0%,32%{opacity:0}34%,96%{opacity:1}100%{opacity:0}}
@keyframes rg{0%,39%{opacity:0}41%,96%{opacity:1}100%{opacity:0}}
@keyframes rh{0%,51%{opacity:0}53%,96%{opacity:1}100%{opacity:0}}
@keyframes ri{0%,57%{opacity:0}59%,96%{opacity:1}100%{opacity:0}}
@keyframes rk{0%,64%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">vibecode-tells</text>
<text x="222" y="50" class="sans" font-size="13.5" fill="#a9adb2">Agent skill + scanner that keeps AI-built websites from looking AI-built</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · DEFAULT OUTPUT</text>
<rect x="32" y="98" width="242" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="242" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">tests/fixtures/vibecoded.html</text>
<line x1="33" y1="123" x2="273" y2="123" stroke="#2e3237"/>
<g fill="#8a7fae"><circle cx="238" cy="164" r="26" opacity=".09"/><circle cx="238" cy="164" r="17" opacity=".12"/><circle cx="238" cy="164" r="9" opacity=".18"/></g>
<text x="46" y="148" class="serif" font-size="15" fill="#b3aacb">It's not a to-do list.</text>
<text x="46" y="166" class="serif" font-size="15" fill="#c7a9c0">It's a second brain.</text>
<g fill="#22262a" stroke="#353a40"><rect x="44" y="204" width="66" height="36" rx="6"/><rect x="117" y="204" width="66" height="36" rx="6"/><rect x="190" y="204" width="66" height="36" rx="6"/></g>
<g fill="none" stroke="#7d838a"><rect x="52" y="211" width="7" height="7" rx="2"/><rect x="125" y="211" width="7" height="7" rx="2"/><rect x="198" y="211" width="7" height="7" rx="2"/></g>
<g fill="#3d4248"><rect x="52" y="224" width="44" height="3"/><rect x="52" y="231" width="30" height="3"/><rect x="125" y="224" width="44" height="3"/><rect x="125" y="231" width="30" height="3"/><rect x="198" y="224" width="44" height="3"/><rect x="198" y="231" width="30" height="3"/></g>
<g class="rc"><rect class="box" x="42" y="133" width="142" height="39"/><circle class="pin" cx="194" cy="142" r="9"/><text class="sans pn" x="194" y="145.5">1</text></g>
<g class="rf"><circle class="pin" cx="194" cy="164" r="9"/><text class="sans pn" x="194" y="167.5">15</text></g>
<g class="rg"><circle class="box" cx="238" cy="164" r="30"/><circle class="pin" cx="259" cy="143" r="9"/><text class="sans pn" x="259" y="146.5">22</text></g>
<g class="re"><rect class="box" x="40" y="200" width="222" height="44"/><circle class="pin" cx="151" cy="200" r="9"/><text class="sans pn" x="151" y="203.5">6</text></g>
<text x="32" y="272" class="sans cap">What ships when nothing is decided.</text>
</g>

<g>
<text x="294" y="88" class="sans lab" fill="#c8963e">2 · SCAN.PY FLAGS EACH TELL</text>
<rect x="294" y="98" width="312" height="152" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h2" x="294" y="98" width="312" height="152" rx="3" stroke="#c8963e"/>
<g class="mono" font-size="10" fill="#e4dfd4">
<g class="rb"><text x="306" y="120">Vibecode scan: tests/fixtures/vibecoded.html</text><text x="306" y="136">29 of 30 tells flagged (heuristic, verify each)</text></g>
<text class="rc" x="306" y="164" xml:space="preserve"><tspan fill="#c8963e">#1</tspan> Harsh gradients  (1 hits)</text>
<text class="re" x="306" y="184" xml:space="preserve"><tspan fill="#c8963e">#6</tspan> 3 feature cards in a row  (1 hits)</text>
<text class="rf" x="306" y="204" xml:space="preserve"><tspan fill="#c8963e">#15</tspan> "It's not X, it's Y" copy  (1 hits)</text>
<text class="rg" x="306" y="224" xml:space="preserve"><tspan fill="#c8963e">#22</tspan> Radial orbs  (2 hits)</text>
</g>
<text x="294" y="272" class="sans cap">Hits are leads to verify, not verdicts.</text>
</g>

<g>
<text x="626" y="88" class="sans lab" fill="#93ad8c">3 · DECIDED ON PURPOSE</text>
<rect x="626" y="98" width="242" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h3" x="626" y="98" width="242" height="152" rx="3" stroke="#93ad8c"/>
<text x="638" y="115" class="mono" font-size="10" fill="#8b9096">tests/fixtures/clean.html</text>
<line x1="627" y1="123" x2="867" y2="123" stroke="#2e3237"/>
<g class="rh serif" font-size="13.5" fill="#e4dfd4"><text x="638" y="150">Bankroll math for the pass line,</text><text x="638" y="168">worked out on real rolls.</text></g>
<g class="ri"><line x1="627" y1="222" x2="867" y2="222" stroke="#2e3237"/><g class="sans" font-size="10" fill="#93ad8c"><text x="638" y="240">Terms of Service</text><text x="740" y="240">Privacy Policy</text></g><g stroke="#93ad8c"><line x1="638" y1="242.5" x2="712" y2="242.5"/><line x1="740" y1="242.5" x2="802" y2="242.5"/></g></g>
<text class="rk mono" x="626" y="272" font-size="11" fill="#93ad8c">No mechanical tells found.</text>
</g>
</svg>
