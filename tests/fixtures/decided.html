<html><head><style>
:root { color-scheme: dark; --ground: #1b1e21; --ink: #e4dfd4; --rule: #2e3237; --sage: #93ad8c; }
body { background: var(--ground); color: var(--ink); font-family: Georgia, serif; max-width: 26rem; margin: 3rem auto; accent-color: var(--sage); }
h1 { font-weight: 400; text-wrap: balance; }
ul { padding: 0; }
li { list-style: none; border-bottom: 1px solid var(--rule); padding: 8px 0; }
a { color: var(--sage); }
</style></head>
<body>
<h1>A to-do list that fits on one screen.</h1>
<ul>
<li><label><input type="checkbox" checked> Renew the car registration</label></li>
<li><label><input type="checkbox"> Book the dentist</label></li>
<li><label><input type="checkbox"> Return the library books</label></li>
</ul>
<footer><a href="/terms">Terms of Service</a> <a href="/privacy">Privacy Policy</a></footer>
</body></html>
